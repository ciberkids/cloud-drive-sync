name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  daemon-lint-test:
    name: Daemon – Lint & Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    defaults:
      run:
        working-directory: daemon

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies (Unix)
        if: runner.os != 'Windows'
        run: |
          python3 -m venv .venv
          .venv/bin/pip install -e ".[dev]"

      - name: Install dependencies (Windows)
        if: runner.os == 'Windows'
        run: |
          python -m venv .venv
          .venv\Scripts\pip install -e ".[dev]"

      - name: Lint (Unix)
        if: runner.os != 'Windows'
        run: .venv/bin/ruff check src/ tests/

      - name: Lint (Windows)
        if: runner.os == 'Windows'
        run: .venv\Scripts\ruff check src/ tests/

      - name: Test (Unix)
        if: runner.os != 'Windows'
        run: .venv/bin/pytest -v --cov=cloud_drive_sync --cov-report=xml

      - name: Test (Windows)
        if: runner.os == 'Windows'
        run: .venv\Scripts\pytest -v --tb=long --cov=cloud_drive_sync --cov-report=xml 2>&1 | tee test-output.txt

      - name: Upload test output on failure (Windows)
        if: runner.os == 'Windows' && failure()
        uses: actions/upload-artifact@v4
        with:
          name: windows-test-output
          path: daemon/test-output.txt

  ui-typecheck:
    name: UI – Type Check (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    defaults:
      run:
        working-directory: ui

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install system dependencies for Tauri
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev

      - name: Install npm dependencies
        run: npm install

      - name: Type check
        run: npx tsc --noEmit

  cargo-check:
    name: Tauri – Cargo Check (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            triple: x86_64-unknown-linux-gnu
            install_deps: true
          - os: windows-latest
            triple: x86_64-pc-windows-msvc
            install_deps: false
          - os: macos-latest
            triple: aarch64-apple-darwin
            install_deps: false
    defaults:
      run:
        working-directory: ui/src-tauri

    steps:
      - uses: actions/checkout@v6

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install system dependencies for Tauri
        if: matrix.install_deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev

      - name: Create sidecar placeholder (Unix)
        if: runner.os != 'Windows'
        run: |
          mkdir -p bin
          touch bin/cloud-drive-sync-daemon-${{ matrix.triple }}
          chmod +x bin/cloud-drive-sync-daemon-${{ matrix.triple }}

      - name: Create sidecar placeholder (Windows)
        if: runner.os == 'Windows'
        run: |
          New-Item -ItemType Directory -Path "bin" -Force | Out-Null
          New-Item -ItemType File -Path "bin/cloud-drive-sync-daemon-${{ matrix.triple }}.exe" -Force | Out-Null
        shell: pwsh

      - name: Cargo check
        run: cargo check --all-targets

  docker-smoke:
    name: Docker – Container Boots (PUID + auth)
    runs-on: ubuntu-latest

    # Two bugs shipped in v2.4.0 because nothing ever started the image:
    # PUID/PGID crashed the daemon before it served anything, and token auth was
    # documented via environment variables that no test exercised. Neither is
    # visible to the unit suite, and the release pipeline builds the image without
    # ever running it. This job runs it.
    steps:
      - uses: actions/checkout@v6

      - name: Build the image
        run: docker build -f docker/Dockerfile -t cds:ci .

      - name: Start it the way the docs tell people to
        run: |
          docker run -d --name cds-ci -p 8080:8080 \
            -e PUID=1000 -e PGID=1000 \
            -e CDS_HTTP_TOKEN=ci-test-token \
            -v cds-ci-config:/root/.config/cloud-drive-sync \
            -v cds-ci-data:/root/.local/share/cloud-drive-sync \
            cds:ci

      - name: Wait for the API, and fail loudly if the container died
        run: |
          for i in $(seq 1 40); do
            # A detached `docker run` exits 0 even when the process crashes on
            # startup, so liveness has to be asserted separately from the launch.
            if [ "$(docker inspect -f '{{.State.Running}}' cds-ci)" != "true" ]; then
              echo "::error::container exited during startup"
              docker logs cds-ci
              exit 1
            fi
            code=$(curl -s -o /dev/null -w '%{http_code}' -m 3 http://127.0.0.1:8080/api/status || true)
            [ "$code" != "000" ] && break
            sleep 3
          done
          docker inspect -f '{{.State.Running}}' cds-ci | grep -qx true

      - name: The daemon runs as the remapped user, not root
        run: |
          uid=$(docker exec cds-ci sh -c 'grep ^Uid /proc/1/status' | awk '{print $2}')
          echo "daemon uid: $uid"
          [ "$uid" = "1000" ]

      - name: A token was read from the environment
        run: docker logs cds-ci 2>&1 | grep -q "requires a token"

      - name: Anonymous requests are refused
        run: |
          for path in /api/status /api/pairs; do
            code=$(curl -s -o /dev/null -w '%{http_code}' -m 5 "http://127.0.0.1:8080$path")
            echo "$path anonymous -> $code"
            [ "$code" = "401" ]
          done

      - name: Delete protection cannot be disabled anonymously
        run: |
          code=$(curl -s -o /dev/null -w '%{http_code}' -m 5 -X PUT \
            -H 'Content-Type: application/json' -d '{"max_deletions_per_sync":0}' \
            http://127.0.0.1:8080/api/settings/max-deletions)
          echo "anonymous disable -> $code"
          [ "$code" = "401" ]

      - name: The correct token is accepted
        run: |
          code=$(curl -s -o /dev/null -w '%{http_code}' -m 5 \
            -H 'Authorization: Bearer ci-test-token' http://127.0.0.1:8080/api/status)
          echo "bearer -> $code"
          [ "$code" = "200" ]

      - name: A wrong token is refused
        run: |
          code=$(curl -s -o /dev/null -w '%{http_code}' -m 5 \
            -H 'Authorization: Bearer wrong' http://127.0.0.1:8080/api/status)
          [ "$code" = "401" ]

      - name: Stored credentials are not world-readable
        run: |
          docker exec cds-ci python -c "
          import pathlib, sys, tempfile
          from google.oauth2.credentials import Credentials
          from cloud_drive_sync.auth import credentials as C
          # An explicit path, so this never writes over a real credentials file
          # if someone runs this against a container with a live volume mounted.
          probe = pathlib.Path(tempfile.mkdtemp()) / 'probe.enc'
          C.save_credentials(Credentials(token='t', refresh_token='r',
              token_uri='u', client_id='c', client_secret='s', scopes=['x']), probe)
          bad = [str(p) for p in (probe, C._salt_path()) if p.stat().st_mode & 0o077]
          sys.exit('world-readable: ' + ', '.join(bad) if bad else 0)
          "

      - name: Every provider's credentials are encrypted, not plaintext
        run: |
          docker exec cds-ci python -c "
          import pathlib, sys, tempfile
          d = pathlib.Path(tempfile.mkdtemp())
          from cloud_drive_sync.auth import credentials as C
          C._get_machine_id = lambda: b'ci-probe'
          from cloud_drive_sync.providers.onedrive import auth as od
          from cloud_drive_sync.providers.box import auth as bx
          from cloud_drive_sync.providers.nextcloud import auth as nc
          od.CREDS_DIR = d/'a'; bx._BOX_CREDENTIALS_DIR = d/'b'; nc._CREDS_DIR = d/'c'
          cases = [
            ('onedrive', od.OneDriveAuth.__new__(od.OneDriveAuth),
             {'token':'SECRET','client_id':'c'}, d/'a'/'onedrive_x.json'),
            ('box', bx.BoxAuth.__new__(bx.BoxAuth),
             {'access_token':'SECRET'}, d/'b'/'x.json'),
            ('nextcloud', nc.NextcloudAuth.__new__(nc.NextcloudAuth),
             {'server_url':'u','username':'u','app_password':'SECRET'},
             d/'c'/'x'/'nextcloud_creds.json'),
          ]
          bad = []
          for name, inst, creds, path in cases:
              inst.save_credentials(creds, 'x')
              if b'SECRET' in path.read_bytes(): bad.append(name + ':plaintext')
              if path.stat().st_mode & 0o077: bad.append(name + ':world-readable')
              if inst.load_credentials('x') != creds: bad.append(name + ':roundtrip')
          sys.exit('; '.join(bad) if bad else 0)
          "

      # First-run token generation, and the upgrade path it must not disturb. These
      # replaced a single check that a token-less container warns — with generation
      # in place a *fresh* container has a token, so that assertion would now fail
      # on correct behaviour. The warning still matters, but only for an upgrade.
      - name: A fresh install generates a token and prints it
        run: |
          docker rm -f cds-ci >/dev/null
          docker run -d --name cds-ci-fresh -p 8081:8080 cds:ci
          sleep 12
          docker logs cds-ci-fresh 2>&1 | grep -q "First run"
          docker logs cds-ci-fresh 2>&1 | grep -q "access token was generated"
          # Protected without anyone setting anything.
          code=$(curl -s -o /dev/null -w '%{http_code}' -m 5 http://127.0.0.1:8081/api/status)
          echo "fresh install, anonymous -> $code"
          [ "$code" = "401" ]

      - name: The printed token actually works
        run: |
          tok=$(docker logs cds-ci-fresh 2>&1 | grep -A2 "access token was generated" \
                | tail -1 | tr -d ' │')
          test -n "$tok"
          code=$(curl -s -o /dev/null -w '%{http_code}' -m 5 \
            -H "Authorization: Bearer $tok" http://127.0.0.1:8081/api/status)
          echo "token from the log -> $code"
          [ "$code" = "200" ]

      - name: An upgrade is not locked out, and still warns
        run: |
          # A config that already exists means an existing deployment. It must keep
          # working without a token, because turning auth on during an update would
          # lock people out of a URL they have bookmarked.
          docker volume create cds-ci-upgrade >/dev/null
          docker run --rm -v cds-ci-upgrade:/root/.config/cloud-drive-sync cds:ci \
            sh -c 'printf "[general]\nlog_level = \"info\"\n" > /root/.config/cloud-drive-sync/config.toml'
          docker run -d --name cds-ci-upgrade -p 8082:8080 \
            -v cds-ci-upgrade:/root/.config/cloud-drive-sync cds:ci
          sleep 12
          docker logs cds-ci-upgrade 2>&1 | grep -q "NO AUTHENTICATION"
          docker logs cds-ci-upgrade 2>&1 | grep -q "First run" && exit 1 || true
          code=$(curl -s -o /dev/null -w '%{http_code}' -m 5 http://127.0.0.1:8082/api/status)
          echo "upgrade, anonymous -> $code (expected 200: unchanged behaviour)"
          [ "$code" = "200" ]

      - name: Container logs on failure
        if: failure()
        run: |
          for c in cds-ci cds-ci-fresh cds-ci-upgrade; do
            echo "=== $c ==="; docker logs "$c" 2>&1 || true
          done
