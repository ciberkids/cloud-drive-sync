[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "cloud-drive-sync"
version = "1.2.0"
description = "Multi-cloud bidirectional file sync daemon for Linux"
requires-python = ">=3.12"
license = "MIT"
dependencies = [
    "google-api-python-client>=2.100.0",
    "google-auth-oauthlib>=1.1.0",
    "google-auth-httplib2>=0.2.0",
    "watchdog>=4.0.0",
    "aiofiles>=23.2.0",
    "tomli-w>=1.0.0",
    "click>=8.1.0",
    "cryptography>=41.0.0",
    "aiosqlite>=0.19.0",
    "platformdirs>=4.0.0",
    "aiohttp>=3.9.0",
]

[project.optional-dependencies]
dropbox = ["dropbox>=12.0.0"]
onedrive = ["msgraph-sdk>=1.0.0", "azure-identity>=1.15.0"]
nextcloud = ["nc-py-api>=0.17.0", "httpx>=0.25.0"]
box = ["box-sdk-gen>=1.0.0"]
mcp = ["mcp>=1.28.0", "uvicorn>=0.30.0"]
all-providers = ["cloud-drive-sync[dropbox,onedrive,nextcloud,box]"]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=4.1.0",
    # Pinned deliberately. Unpinned, CI floats to the newest ruff and can go red
    # with no code change: 0.16.0 promoted a batch of rules and reports 183
    # findings against code that 0.15.x passes cleanly. Raise this intentionally,
    # with the cleanup, rather than letting a release decide when CI breaks.
    "ruff>=0.15.4,<0.16",
    "httpx>=0.25.0",
    # The MCP transport tests need the real SDK. CI installs only [dev], so
    # without this the transport layer would go untested there.
    "mcp>=1.28.0",
    "uvicorn>=0.30.0",
]

[project.scripts]
cloud-drive-sync-daemon = "cloud_drive_sync.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["src/cloud_drive_sync"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "integration: integration tests using demo mode (no real Google credentials)",
    "nextcloud: integration tests that spin up a real Nextcloud container (requires docker/podman)",
]

[tool.ruff]
target-version = "py312"
line-length = 100
